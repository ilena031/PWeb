<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page – Tugas 7 PWEB</title>
    <meta name="description" content="Halaman login dengan Bootstrap – Tugas 7 Pemrograman Web" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <!-- Custom CSS override -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Full-page wrapper -->
    <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="brand-icon mb-2">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <h1 class="fw-bold heading-title">Masuk ke Akun</h1>
                    </div>

                    <!-- Login Card -->
                    <div class="card login-card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form id="loginForm" novalidate>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold label-custom">Alamat Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text icon-box"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control input-custom" id="email"
                                            placeholder="contoh@email.com" required />
                                    </div>
                                    <div class="invalid-feedback" id="errEmail"></div>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold label-custom">Kata Sandi</label>
                                    <div class="input-group">
                                        <span class="input-group-text icon-box"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control input-custom" id="password"
                                            placeholder="Masukkan kata sandi" required />
                                        <button class="btn btn-outline-secondary toggle-pass" type="button"
                                            id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" id="errPassword"></div>
                                </div>

                                <!-- Remember & Forgot -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input check-custom" type="checkbox" id="rememberMe" />
                                        <label class="form-check-label small label-custom" for="rememberMe">Ingat
                                            saya</label>
                                    </div>
                                    <a href="#" class="small link-custom" id="forgotPasswordLink">Lupa kata sandi?</a>
                                </div>

                                <!-- Login Button -->
                                <button type="submit" class="btn btn-login w-100 fw-semibold mb-3" id="btnLogin">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
                                </button>

                                <!-- Divider -->
                                <div class="divider-line d-flex align-items-center my-3">
                                    <hr class="flex-grow-1" />
                                    <span class="px-3 small text-muted-custom">atau</span>
                                    <hr class="flex-grow-1" />
                                </div>

                                <!-- Social Login -->
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-social" id="btnGoogle">
                                        <i class="bi bi-google me-2"></i> Masuk dengan Google
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Register link -->
                    <p class="text-center mt-3 small text-muted-custom">
                        Belum punya akun? <a href="#" class="link-custom fw-semibold" id="registerLink">Daftar
                            sekarang</a>
                    </p>

                    <!-- Footer -->
                    <footer class="text-center mt-4">
                        <p class="small text-muted-custom">&copy; 2026 Tugas PWEB</p>
                    </footer>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
